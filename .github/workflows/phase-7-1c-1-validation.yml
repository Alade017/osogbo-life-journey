name: Phase 7.1c.1 validation

on:
  push:
    branches:
      - fix/phase-7-1c-1-home-departure

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install project dependencies
        run: |
          npm install --global npm@11.6.2
          npm ci
      - name: Run tests
        run: npm test -- --reporter=dot
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
